# Loaded only when a test activates the "test" profile (@ActiveProfiles("test")).
# @ServiceConnection replaces the datasource URL with the Testcontainers Postgres instance.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Keep the test log focused on failures. The aspects still run; they just do not print at INFO.
logging.level.org.example.jobportalappbackend.aop=warn
logging.level.org.hibernate.SQL=warn

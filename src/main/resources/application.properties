# Name shown in logs and in /actuator/info. Kept from the previous project so log output stays familiar.
spring.application.name=JobPortalAppBackend

# The React app calls http://localhost:8080. PORT lets a host (or the frontend) move the server without a code change.
server.port=${PORT:8080}

# Java 25 virtual threads. Tomcat handles each HTTP request on a virtual thread instead of a fixed platform-thread pool.
# This fits a small API that spends its time waiting on the database. See docs/GUIDE.md.
# Java 24+ is the recommended runtime for virtual threads; Java 25 LTS satisfies that.
spring.threads.virtual.enabled=true

# Do not keep a Hibernate session open after the service method returns.
# Controllers only see DTOs, so they never touch a lazy collection. Leaving this on hides that mistake until production.
spring.jpa.open-in-view=false

# Update the schema to match the entities when the app starts. Convenient for learning; do not use it on a production database.
# Tests override this with create-drop so each run gets an empty database.
spring.jpa.hibernate.ddl-auto=update

# Print SQL in the local console so you can see what JPA generated. Tests turn this off.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local learning defaults. They match the previous application.properties so an existing egen-mockdb still works.
# Override them in the environment for any shared or deployed database. Never commit a real password.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/egen-mockdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

# HMAC secret used to sign JWTs. It must be at least 32 bytes. The previous app generated a new key on every startup,
# which logged everyone out at each restart and printed the key to the console. Set JWT_SECRET outside this file
# before you share the app with anyone.
app.jwt.secret=${JWT_SECRET:dev-only-change-me-please-32b-min!!}
# 30 minutes, same lifetime the frontend already assumes (TOKEN_EXPIRATION_TIME).
app.jwt.expiration=${JWT_EXPIRATION:30m}

# Browser origin of the Next.js app. Credentials (cookies) are allowed, so this cannot be "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Turn Spring's built-in errors into RFC 9457 Problem Details as well as the ones we build ourselves.
spring.mvc.problemdetails.enabled=true
# Never put a Java stack trace in an HTTP response.
server.error.include-stacktrace=never

# Only these actuator endpoints are registered on the web. Everything else (env, beans, ...) stays off the HTTP port.
management.endpoints.web.exposure.include=health,info
# "when_authorized" hides component details (database URL and so on) from anonymous callers.
management.endpoint.health.show-details=when_authorized
# Publish the info.* keys below at GET /actuator/info. This contributor is off unless we turn it on.
management.info.env.enabled=true

info.app.name=Job Portal Backend
info.app.description=Learning Spring Boot API for jobs and user accounts
info.app.java=25
info.app.spring-boot=4.1.2

# Swagger UI. The OpenAPI document itself is always at /v3/api-docs.
springdoc.swagger-ui.path=/swagger-ui.html
